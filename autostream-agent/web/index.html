<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoStream Agent</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outlet:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glob"></div>
    <div class="background-glob-2"></div>

    <div class="app-container">
        <header>
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>AutoStream AI</h1>
            </div>
            <div class="status-indicator">
                <span class="dot"></span> Online
            </div>
        </header>
        
        <main class="chat-container" id="chat-container">
            <div class="message assistant-message">
                <div class="message-content">
                    Hello! I'm the AutoStream assistant. I can help you with pricing, plans, or signing up. How can I help you today?
                </div>
                <div class="message-meta">Just now</div>
            </div>
        </main>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
                <button id="send-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
